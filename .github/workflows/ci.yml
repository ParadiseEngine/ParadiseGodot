name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  GODOT_VERSION: 4.7-stable

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ParadiseGodot.slnx

      - name: Build
        run: dotnet build ParadiseGodot.slnx --no-restore

      - name: Test
        run: |
          for project in Paradise.Sample.Pool.Tests Paradise.Sample.Odyssey.Tests Paradise.Sample.Ui.Tests Paradise.Sample.Runtime.Tests; do
            dotnet test --project "$project/$project.csproj" --no-build --output normal
          done

  # Protects the package half of the addon: it must pack, the payload and targets must be IN the
  # package (a lib-only package restores fine and then silently does nothing in a game repo), and
  # the materializer must still place that payload correctly in every state a repo can be in -
  # fresh install, up to date, a deleted file, a local edit, a version bump, and adoption of a
  # hand-vendored copy. The uid assertions in that harness are the ones that matter most: Godot
  # mints resource uids per project and scenes bind scripts by uid, so a materializer that
  # rewrote one would silently detach every node using it.
  addon-nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Addon dependency allowlist
        run: bash scripts/check_addon_deps.sh

      - name: Pack addon package
        run: dotnet pack Paradise.Godot.Editor/Paradise.Godot.Editor.csproj -c Release -o artifacts/nuget

      - name: Materialization tests
        run: bash Paradise.Godot.Editor/tests/materialize-tests.sh

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: paradise-godot-editor-nupkg
          path: artifacts/nuget/*.nupkg

  # The gate that protects addon users: import the project with a real headless Godot
  # editor, run the scene export through the plugin, and require (a) the export to succeed
  # and (b) the runtime contract tests to pass against the freshly exported data/.
  export-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Cache Godot
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-mono-linux-x86_64

      - name: Download Godot (.NET build)
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -sSL -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_mono_linux_x86_64.zip"
          unzip -q ~/godot/godot.zip -d ~/godot

      - name: Resolve Godot binary
        run: echo "GODOT_BIN=$(find ~/godot -name 'Godot_v*_mono_linux.x86_64' -type f | head -1)" >> "$GITHUB_ENV"

      - name: Build C# assemblies
        run: dotnet build ParadiseGodot.csproj

      - name: Import project
        run: $GODOT_BIN --headless --import --path . || true  # first import surfaces non-fatal warnings

      # The addon's res:// scripts must never DERIVE from a type in the package assembly. Godot
      # registers such a base as a script type too, and its ScriptTypeBiMap throws a duplicate-key
      # exception on every assembly reload - breaking editor hot-reload and pinning the inspector
      # to "This inspector might be out of date" (godotengine/godot#75352). Composition avoids it.
      #
      # This only reproduces on a RELOAD, which a cold headless run never performs - which is
      # exactly how it shipped in 0.13.0 past a green build, passing tests and a byte-identical
      # export. Touching a source and passing --build-solutions makes the editor rebuild and
      # reload in-process, which is the path that throws.
      - name: Assembly reload must be clean
        run: |
          touch addons/paradise/Authoring/AuthoredEntityNode.cs
          $GODOT_BIN --headless --editor --build-solutions --path . --quit-after 900 2>&1 | tee reload.log || true
          if grep -q "same key has already been added" reload.log; then
            echo "::error::Godot could not reload the C# assembly. A res:// script is deriving from a type in the package assembly; use composition instead. Offending types:"
            grep -oE "Key: [A-Za-z.]+" reload.log | sort -u
            exit 1
          fi
          if grep -q "Resource file not found: res:// " reload.log; then
            echo "::error::Script resolution failed on reload - same cause as above."
            exit 1
          fi
          echo "Assembly reload clean."

      - name: Headless scene export
        run: PARADISE_EXPORT_SCENE=res://scenes/sample.tscn $GODOT_BIN --headless --editor --path .

      - name: Show export drift (informational)
        run: git diff --stat -- data/ || true

      - name: Contract tests against fresh export
        run: |
          dotnet build Paradise.Sample.Runtime.Tests/Paradise.Sample.Runtime.Tests.csproj
          dotnet test --project Paradise.Sample.Runtime.Tests/Paradise.Sample.Runtime.Tests.csproj --no-build --output normal

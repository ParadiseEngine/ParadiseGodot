name: Addon release

# Tag `addon-vX.Y.Z` (matching addons/paradise/plugin.cfg's version) to cut a release:
# packages the addon zip and publishes a GitHub release. The Godot Asset Library listing
# is updated in a follow-up step ONLY when the ASSETLIB_TOKEN secret is configured — the
# initial listing is a one-time manual submission (see docs/publishing.md).

on:
  push:
    tags:
      - "addon-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches plugin.cfg
        run: |
          tag_version="${GITHUB_REF_NAME#addon-v}"
          cfg_version="$(sed -n 's/^version="\(.*\)"/\1/p' addons/paradise/plugin.cfg)"
          if [ "$tag_version" != "$cfg_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match plugin.cfg version $cfg_version"
            exit 1
          fi

      - name: Addon dependency allowlist
        run: bash scripts/check_addon_deps.sh

      - name: Package addon zip
        run: bash scripts/package_addon.sh "paradise-addon-${GITHUB_REF_NAME#addon-}.zip"

      - name: Package starter project zip
        run: bash scripts/package_starter.sh "paradise-starter-${GITHUB_REF_NAME#addon-}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "paradise-addon-${GITHUB_REF_NAME#addon-}.zip" \
            "paradise-starter-${GITHUB_REF_NAME#addon-}.zip" \
            --title "Paradise Engine Tools ${GITHUB_REF_NAME#addon-}" \
            --generate-notes

      - name: Update Godot Asset Library listing
        if: ${{ vars.ASSETLIB_ASSET_ID != '' }}
        env:
          ASSETLIB_TOKEN: ${{ secrets.ASSETLIB_TOKEN }}
        run: |
          if [ -z "$ASSETLIB_TOKEN" ]; then
            echo "ASSETLIB_ASSET_ID set but ASSETLIB_TOKEN secret missing; skipping."
            exit 0
          fi
          version="${GITHUB_REF_NAME#addon-v}"
          curl -sS -X POST "https://godotengine.org/asset-library/api/asset/${{ vars.ASSETLIB_ASSET_ID }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"token\": \"$ASSETLIB_TOKEN\",
              \"version_string\": \"$version\",
              \"download_commit\": \"$GITHUB_SHA\"
            }"

[plugin]

name="Paradise Engine Tools"
description="Use Godot as the authoring editor for Paradise Engine: entity authoring (AuthoredEntityNode), asset pipeline (GLB→KTX2, primitives, model prefabs), scene/navmesh/material export to the engine-neutral data contract, and one-click preview in the standalone .NET runtime. Delivered by the Paradise.Godot.Editor NuGet package; this file and the two scripts beside it are the only parts that live in the game repo."
author="Paradise Engine"
version="0.13.3"
script="ParadiseExportPlugin.cs"

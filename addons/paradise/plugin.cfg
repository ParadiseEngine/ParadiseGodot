[plugin]

name="Paradise Engine Tools"
description="Use Godot as an authoring editor for Paradise Engine: assets/ is the source of truth, *.prefab documents open as scenes and save back, entities are authored on AuthoredEntityNode against the game's own schema, and Play runs the game on what `paradise assets build` produced. Delivered by the Paradise.Godot.Editor NuGet package; this file and the two scripts beside it are the only parts that live in the game repo."
author="Paradise Engine"
version="0.40.0"
script="ParadiseExportPlugin.cs"

[plugin]

name="Paradise Engine Tools"
description="Use Godot as the authoring editor for Paradise Engine: entity authoring (EntityExport), asset pipeline (GLB→KTX2, primitives, model prefabs), scene/navmesh/material export to the engine-neutral data contract, and one-click preview in the standalone .NET runtime. Requires the Godot .NET build and the Paradise.Export NuGet package (run Project > Tools > Paradise/Project Setup after install)."
author="Paradise Engine"
version="0.13.0"
script="ParadiseExportPlugin.cs"
